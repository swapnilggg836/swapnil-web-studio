<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:hsl(199,89%,48%);stop-opacity:1" />
      <stop offset="100%" style="stop-color:hsl(199,89%,70%);stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111111;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="url(#bgGrad)" />

  <!-- Outer glow ring -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="url(#logoGrad)" stroke-width="1.5" opacity="0.6" />

  <!-- Letter S -->
  <text
    x="50"
    y="67"
    font-family="'Inter', Arial, sans-serif"
    font-size="58"
    font-weight="900"
    fill="url(#logoGrad)"
    text-anchor="middle"
    letter-spacing="-2"
  >S</text>

  <!-- Bottom dot accent -->
  <circle cx="50" cy="88" r="3" fill="url(#logoGrad)" opacity="0.8" />
</svg>
